name: Build Android MVP APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK toolchains
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.22.1'
      - name: Restore reusable Debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lfm3local-preview-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Checkout pinned llama.cpp
        run: bash scripts/bootstrap-llama.sh
      - name: Harness and local logic unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2
      - name: Build Debug APK
        run: |
          for attempt in 1 2 3; do
            if gradle -p android :app:assembleDebug --no-daemon --stacktrace --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Verify arm64 library packaged
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libai-chat.so'
      - name: Verify side-by-side Preview applicationId
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='br.com.lfm3local.preview'"
      - uses: actions/upload-artifact@v4
        with:
          name: LFM3Local-Harness-v0.5.0-preview-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
